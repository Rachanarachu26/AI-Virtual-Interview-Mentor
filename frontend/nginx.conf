server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container. Because the browser only ever
    # talks to this same origin, there are no CORS issues.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 15m;    # allow resume PDF uploads (max 10 MB)
        proxy_read_timeout 180s;     # allow slow Gemini / Whisper responses
        proxy_send_timeout 180s;
    }

    # Single-page app: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
